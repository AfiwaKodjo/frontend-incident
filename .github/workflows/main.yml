name: Angular CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  frontend-build:
    name: Build Angular Application
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install

      - name: Construire Angular
        run: npm run build
